id: multihop_shared_banking_healthcare
query_class: multi_hop
question: Which technologies are shared by Banking Sector Digital Audit 2024 and Healthcare Data Migration to Azure Cloud?
retrieval_scope: sample
expected_optimal_mode: hybrid
mode_rationale: Two-project technology join with original passages to distinguish product editions from technology families.
expected_intent: search
expected_tools: [search_knowledge_base]
expected_behavior: answer
reference: Both projects mention Microsoft Azure, Azure Data Factory, Azure SQL, and Power BI. The banking stack specifies DirectQuery while the healthcare stack specifies Power BI Premium; shared families do not imply identical editions.
required_evidence:
  - source: 01_Banking_Sector_Digital_Audit_2024.pdf
    page: 2
    anchors: [Azure Data Factory, Azure SQL Database, Power BI with DirectQuery]
  - source: 02_Healthcare_Data_Migration_to_Azure_Cloud.pdf
    page: 2
    anchors: [Azure Data Factory, Azure SQL, Power BI Premium]
---
id: comparison_delivery_budget
query_class: cross_document_comparison
question: Compare the timelines and budget ranges of the healthcare migration and insurance claims automation projects.
retrieval_scope: sample
expected_optimal_mode: hybrid
mode_rationale: Structured fields span two projects and two source pages per project.
expected_intent: compare
expected_tools: [search_knowledge_base, compare_projects]
expected_behavior: answer
reference: Healthcare migration proposes 18 weeks and $1,200,000-$1,500,000 USD. Insurance claims automation specifies 16 weeks and $650,000-$800,000 USD. These are estimated budgets, not actual expenditure.
answer_anchors: [18 weeks, 16 weeks]
required_evidence:
  - source: 02_Healthcare_Data_Migration_to_Azure_Cloud.pdf
    page: 2
    anchors: ['Total Duration: 18 weeks']
  - source: 02_Healthcare_Data_Migration_to_Azure_Cloud.pdf
    page: 3
    anchors: ['$1,200,000 - $1,500,000 USD']
  - source: 04_Insurance_Claims_Processing_Automation.pdf
    page: 2
    anchors: ['Total Duration: 16 weeks']
  - source: 04_Insurance_Claims_Processing_Automation.pdf
    page: 3
    anchors: ['$650,000 - $800,000 USD']
---
id: comparison_outcome_modality
query_class: cross_document_comparison
question: Compare the retail supply-chain stockout reduction with the manufacturing predictive-maintenance downtime reduction, distinguishing achieved from projected results.
retrieval_scope: sample
expected_optimal_mode: vector_only
mode_rationale: Outcome modality in prose matters more than an entity join; a graph join alone must not promote a projection to an achievement.
expected_intent: compare
expected_tools: [search_knowledge_base, compare_projects]
expected_behavior: answer
reference: The retail case study achieved a 34% stockout reduction. The manufacturing proposal projects a 45% reduction in unplanned equipment downtime; it is not a reported completed outcome.
answer_anchors: [34%, 45%]
required_evidence:
  - source: 03_Retail_Supply_Chain_Analytics_Platform.pdf
    page: 3
    anchors: [Reduced stockout rates by 34%]
  - source: 10_Manufacturing_IoT_Predictive_Maintenance_Platform.pdf
    page: 3
    anchors: [Projected 45% reduction in unplanned equipment downtime]
