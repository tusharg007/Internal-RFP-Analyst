id: multihop_shared_retail_pharma
query_class: multi_hop
question: Which technologies are shared by Retail Supply Chain Analytics Platform and Pharma Clinical Trial Data Platform?
retrieval_scope: sample
expected_optimal_mode: hybrid
mode_rationale: Project-to-technology-to-project join needs both original technology-stack witnesses.
expected_intent: search
expected_tools: [search_knowledge_base]
expected_behavior: answer
reference: Both projects mention Apache Airflow, Python, and AWS infrastructure including S3 and Lambda. Their warehouses differ (Snowflake versus Amazon Redshift); these are not shared technologies.
required_evidence:
  - source: 03_Retail_Supply_Chain_Analytics_Platform.pdf
    page: 2
    anchors: [Apache Airflow, Python, 'AWS (S3, EC2, Lambda)']
  - source: 07_Pharma_Clinical_Trial_Data_Platform.pdf
    page: 2
    anchors: [Apache Airflow, Python, 'AWS (S3, Glue, Lambda, Step Functions)']
