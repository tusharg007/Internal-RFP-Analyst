id: matching_uploaded_controls
query_class: requirement_matching
question: Find relevant case studies for the uploaded RFP requiring Azure migration, executive dashboards, and HIPAA controls. Distinguish proposals from delivered evidence.
retrieval_scope: all
expected_optimal_mode: hybrid
mode_rationale: Uploaded requirement-to-technology/framework-to-project matching needs target and candidate witnesses, with proposal qualifications preserved.
expected_intent: rfp_analysis
expected_tools: [search_knowledge_base, extract_rfp_requirements, find_relevant_case_studies]
expected_behavior: answer
reference: The uploaded RFP asks for Azure migration, executive dashboards, HIPAA controls, and phased delivery. Healthcare Data Migration to Azure Cloud is a relevant proposal with Azure, Power BI, and HIPAA controls, not a delivered case study proving all requirements were achieved.
required_evidence:
  - source: eval_target_rfp.pdf
    page: 1
    anchors: [Azure migration, executive dashboards, HIPAA controls]
  - source: 02_Healthcare_Data_Migration_to_Azure_Cloud.pdf
    page: 1
    anchors: ['Document Type: Proposal']
  - source: 02_Healthcare_Data_Migration_to_Azure_Cloud.pdf
    page: 2
    anchors: [Power BI, HIPAA]
---
id: matching_clinical_requirements
query_class: requirement_matching
question: Find case studies for an RFP requiring FDA 21 CFR Part 11, automated regulatory submissions, and achieved clinical data reconciliation improvements.
retrieval_scope: sample
expected_optimal_mode: hybrid
mode_rationale: Framework membership narrows candidates; achieved outcome and regulatory-submission evidence must be verified in the original passages.
expected_intent: rfp_analysis
expected_tools: [search_knowledge_base, find_relevant_case_studies]
expected_behavior: answer
reference: Pharma Clinical Trial Data Platform is a delivered case study reporting FDA 21 CFR Part 11 compliance certification, 85% automated routine regulatory submissions, and a 75% reduction in clinical data reconciliation time.
answer_anchors: [75%, 85%]
required_evidence:
  - source: 07_Pharma_Clinical_Trial_Data_Platform.pdf
    page: 1
    anchors: ['Document Type: Case Study']
  - source: 07_Pharma_Clinical_Trial_Data_Platform.pdf
    page: 3
    anchors: [clinical data reconciliation time by 75%, 85% of routine regulatory submissions, compliance certification]
