# Independent, source-checked extension; the original golden_questions.yaml is unchanged.
# Optimal modes are hypotheses, not measured winners. Pages are ONE-BASED.
id: semantic_modernization
query_class: semantic_single_hop
question: Summarize the modernization priorities identified by the banking digital audit.
retrieval_scope: sample
expected_optimal_mode: vector_only
mode_rationale: Narrative priorities require original prose, not entity intersections.
expected_intent: search
expected_tools: [search_knowledge_base]
expected_behavior: answer
reference: The banking audit assessed digital maturity and data governance, benchmarked peers, and recommended a prioritized modernization roadmap with ROI projections.
required_evidence:
  - source: 01_Banking_Sector_Digital_Audit_2024.pdf
    page: 2
    anchors: [transformation maturity, transformation roadmap with ROI projections]
---
id: semantic_healthcare_security
query_class: semantic_single_hop
question: What does the healthcare migration proposal say about protecting patient data during migration?
retrieval_scope: sample
expected_optimal_mode: vector_only
mode_rationale: Security measures and proposed status require passage-level interpretation.
expected_intent: search
expected_tools: [search_knowledge_base]
expected_behavior: answer
reference: The healthcare proposal calls for zero data loss and HIPAA-compliant encryption at rest and in transit. These are proposed controls, not evidence of completed certification.
required_evidence:
  - source: 02_Healthcare_Data_Migration_to_Azure_Cloud.pdf
    page: 2
    anchors: [zero data loss, encryption at rest and in transit]
