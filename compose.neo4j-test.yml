# Disposable local test service, NOT a production deployment/authorization model.
# Supply NEO4J_TEST_PASSWORD in your shell; no credentials are checked in.
services:
  neo4j-test:
    image: neo4j:5.26-community
    ports:
      - "127.0.0.1:17474:7474"
      - "127.0.0.1:17687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_TEST_PASSWORD:?Set a disposable Neo4j test password}"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    # No host volume: only synthetic, uniquely namespaced integration data.
